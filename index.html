<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1d1b2f">
<title>Conserta Já</title>
<style>
:root{--bg:#1d1b2f;--card:#2a2742;--card2:#353152;--ink:#f6f1e7;--muted:#b9b3cf;--acc:#ffb84d;--ok:#5fd39a;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.screen{display:none;max-width:460px;margin:0 auto;padding:14px;flex-direction:column;gap:10px;min-height:100vh}
.screen.on{display:flex}
button{font:inherit}
/* --- tela inicial --- */
#home{justify-content:center;align-items:center;text-align:center;gap:14px;background:radial-gradient(circle at 50% 30%,#3a3460 0,#1d1b2f 65%)}
.hero{width:min(78vw,300px)}
.logo{font-size:44px;font-weight:900;letter-spacing:-1px;margin:0;line-height:1}
.logo span{color:var(--acc)}
.tag{color:var(--muted);margin:0 0 10px;font-size:15px;max-width:300px;line-height:1.4}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:17px;cursor:pointer;margin-top:8px}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--acc);color:#2a1d05;box-shadow:0 6px 0 #c98a2c}
.btn.p:active{box-shadow:0 2px 0 #c98a2c;transform:translateY(4px)}
.btn.s{background:var(--card2);color:var(--ink)}
.homeBtns{width:100%;max-width:320px}
.total{font-size:14px;color:var(--muted)}
.total b{color:var(--acc)}
/* --- topo --- */
.top{display:flex;align-items:center;gap:10px}
.back{background:var(--card);border:0;color:var(--ink);font-size:18px;width:40px;height:40px;border-radius:12px;cursor:pointer;flex:none}
.top .nm{font-weight:800;font-size:17px;flex:1}
.top .tm{font-variant-numeric:tabular-nums;color:var(--muted)}
/* --- fases --- */
.lvl{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px;color:var(--ink);text-align:left;cursor:pointer;width:100%}
.lvl:active{border-color:var(--acc);transform:scale(.98)}
.lvl .ico{width:54px;height:54px;flex:none;background:var(--card2);border-radius:14px;display:grid;place-items:center}
.lvl .ico svg{width:40px;height:40px}
.lvl b{display:block;font-size:16px}
.lvl small{color:var(--muted);font-size:13px}
.lvl .rt{margin-left:auto;text-align:right;flex:none}
.lvl .st{font-size:15px;letter-spacing:1px;color:var(--acc)}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;margin-top:3px}
.c1{background:#24453a;color:var(--ok)}.c2{background:#4a3c1d;color:var(--acc)}.c3{background:#4a2330;color:var(--bad)}
/* --- como jogar --- */
.howc{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px}
.howc .n{flex:none;width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.howc .n svg{width:32px;height:32px}
.howc b{display:block;margin-bottom:2px}
.howc p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.tips{background:#2d2a20;border-radius:14px;padding:10px 12px;font-size:14px;color:#e9dcc0;line-height:1.5}
/* --- jogo --- */
.meter{background:var(--card);border-radius:12px;padding:8px 10px}
.meter .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.meter .lb .ps{color:var(--acc);font-weight:700}
.bar{height:12px;background:#15131f;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--ok);transition:background .3s}
.step{background:var(--card);border-radius:14px;padding:10px 12px;min-height:84px}
.step .n{font-size:12px;color:var(--acc);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.step .g{font-size:16px;margin-top:3px;line-height:1.35}
.step .act{margin-top:7px;font-size:13px;color:var(--ok);font-weight:700}
.step .act .bar{height:8px;margin-top:4px}
.step .act .bar i{background:var(--ok);transition:none}
.scene{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/2;touch-action:none}
.scene svg{display:block;width:100%;height:100%}
.scene.armed{outline:3px dashed var(--ok);outline-offset:-3px;cursor:pointer}
.scene.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:7px 12px;border-radius:10px;font-size:14px;font-weight:700;background:rgba(0,0,0,.78);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:4}
.toast.on{opacity:1}
.toast.bad{color:var(--bad)}.toast.ok{color:var(--ok)}
.observe{position:absolute;inset:0;display:grid;place-items:end center;padding-bottom:10px;pointer-events:none;z-index:2}
.observe div{background:rgba(20,16,32,.72);padding:10px 16px;border-radius:14px;font-weight:800;text-align:center}
.observe small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.pop{position:absolute;pointer-events:none;font-weight:900;color:#fff;font-size:18px;animation:pop .5s forwards;text-shadow:0 2px 4px #000;z-index:3}
@keyframes pop{to{transform:translateY(-30px);opacity:0}}
.qte{position:absolute;transform:translate(-50%,-50%);border:0;background:var(--bad);color:#fff;font-weight:900;font-size:15px;padding:12px 16px;border-radius:999px;animation:pulse .6s infinite;cursor:pointer;z-index:3;max-width:82%}
.qte .ring{position:absolute;inset:-10px;border:4px solid #fff;border-radius:999px;animation:shrink linear forwards;pointer-events:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.7)}100%{box-shadow:0 0 0 12px rgba(255,107,107,0)}}
@keyframes shrink{from{inset:-28px;opacity:1}to{inset:0;opacity:.2}}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{background:var(--card);border:2px solid transparent;border-radius:14px;padding:6px 2px 5px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tool svg{width:36px;height:36px}
.tool .t{font-size:11px;color:var(--muted);line-height:1.15;text-align:center;min-height:25px;display:flex;align-items:center}
.tool:active{transform:scale(.94)}
.tool.sel{border-color:var(--ok);background:#2d4a3f}
.tool.no{border-color:var(--bad);background:#4a2330}
.tool.hint{animation:hint 1s ease-in-out infinite}
@keyframes hint{50%{border-color:var(--acc);box-shadow:0 0 14px rgba(255,184,77,.55)}}
/* --- modal --- */
.modal{position:fixed;inset:0;background:rgba(10,8,20,.8);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.on{display:flex}
.box{background:var(--card);border-radius:20px;padding:20px;max-width:400px;width:100%;text-align:center;animation:boxIn .3s ease-out}
@keyframes boxIn{from{transform:scale(.9);opacity:0}}
.box h2{margin:4px 0 8px;font-size:22px}
.box p{color:var(--muted);line-height:1.45;margin:0 0 12px}
.box .big svg{width:64px;height:64px}
.stars{font-size:36px;color:var(--acc);letter-spacing:4px;margin:4px 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:var(--card2);border-radius:12px;padding:8px;font-size:13px;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:17px}
/* --- animações das cenas --- */
.in{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;transform-box:fill-box;transform-origin:center}
@keyframes popIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.fadeIn{animation:fadeIn .6s ease-out both}
@keyframes fadeIn{from{opacity:0}}
.lift{animation:lift .7s ease-out both}
@keyframes lift{from{transform:translateY(10px)}to{transform:none}}
.drop{animation:drop .7s ease-in both}
@keyframes drop{from{transform:translateY(-10px)}to{transform:none}}
.rain line,.water line{animation:fall .55s linear infinite}
.water line{animation-duration:.35s}
@keyframes fall{from{transform:translateY(-25px)}to{transform:translateY(45px)}}
.drip{animation:drip 1s ease-in infinite}
@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(34px);opacity:.15}}
.spray path{stroke-dasharray:6 7;animation:spray .4s linear infinite}
@keyframes spray{to{stroke-dashoffset:-13}}
.spark{animation:blink .25s steps(2) infinite}
.blinkO{animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.flick{animation:flick 1.3s infinite}
@keyframes flick{0%,40%,44%,100%{opacity:1}42%{opacity:.2}}
.flash{opacity:0;animation:flash 6s infinite}
@keyframes flash{0%,86%,90%,100%{opacity:0}87%,89%{opacity:.75}}
.smoke circle{animation:rise 2.2s ease-out infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-30px);opacity:.2}}
.steam path{animation:steam 2.2s ease-out infinite}
@keyframes steam{from{transform:translateY(0);opacity:.7}to{transform:translateY(-26px);opacity:0}}
</style>
</head>
<body>

<!-- TELA INICIAL -->
<section class="screen on" id="home">
  <svg class="hero" id="hero" viewBox="0 0 200 170"></svg>
  <h1 class="logo">Conserta <span>Já</span></h1>
  <p class="tag">Escolha a ferramenta certa, na ordem certa, antes que o estrago aumente.</p>
  <div class="homeBtns">
    <button class="btn p" id="btnPlay">▶ Jogar</button>
    <button class="btn s" id="btnHow">Como jogar</button>
  </div>
  <div class="total" id="totalStars"></div>
</section>

<!-- SELEÇÃO DE FASES -->
<section class="screen" id="select">
  <div class="top"><button class="back" data-go="home" aria-label="Voltar">←</button><div class="nm">Escolha o conserto</div></div>
  <div id="levels" style="display:flex;flex-direction:column;gap:10px"></div>
</section>

<!-- COMO JOGAR -->
<section class="screen" id="how">
  <div class="top"><button class="back" data-go="home" aria-label="Voltar">←</button><div class="nm">Como jogar</div></div>
  <div id="howList" style="display:flex;flex-direction:column;gap:10px"></div>
  <div class="tips">💡 Ferramenta errada aumenta o dano, e algumas são <b>perigosas</b> fora de hora. Travou? Depois de alguns segundos, a ferramenta certa começa a piscar.</div>
  <button class="btn p" id="btnHowPlay">Entendi, bora jogar</button>
</section>

<!-- JOGO -->
<section class="screen" id="game">
  <div class="top">
    <button class="back" id="btnQuit" aria-label="Sair">←</button>
    <div class="nm" id="lvName"></div>
    <div class="tm" id="time">0:00</div>
  </div>
  <div class="meter">
    <div class="lb"><span id="meterName"></span><span id="meterPct">0%</span></div>
    <div class="bar"><i id="meterFill"></i></div>
  </div>
  <div class="step" id="step"></div>
  <div class="scene" id="scene">
    <div id="svgWrap" style="width:100%;height:100%"></div>
    <div class="observe" id="observe" style="display:none"><div>👀 Observe a cena<small id="obsTxt"></small></div></div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="tools" id="tools"></div>
</section>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
/* ================= ESTILO BASE ================= */
const O='#2a2233';
const K=` stroke="${O}" stroke-width="2" stroke-linejoin="round"`;
const K1=` stroke="${O}" stroke-width="1.5" stroke-linejoin="round"`;
const rnd=(a,b)=>a+Math.random()*(b-a);
const n=(s,k)=>s===k?' class="in"':'';

/* ================= ÍCONES DAS FERRAMENTAS ================= */
const IC={
 balde:`<path d="M9 14 H31 L28 34 H12Z" fill="#e05a47"${K}/><path d="M20 14 H31 L28 34 H22Z" fill="#b94232"/><path d="M9 14 H31 L28 34 H12Z" fill="none"${K}/><path d="M9 14 Q20 2 31 14" fill="none"${K}/><ellipse cx="20" cy="14" rx="11" ry="2.5" fill="#7a2a20"${K}/>`,
 luvas:`<path d="M12 33 V20 Q12 16 15 16 V9 Q15 7 17 7 Q19 7 19 9 V15 V7 Q19 5 21 5 Q23 5 23 7 V15 V8 Q23 6 25 6 Q27 6 27 8 V18 L30 15 Q32 13 33.5 15 Q34.5 16.5 32 19.5 L27 27 V33Z" fill="#f2a33a"${K}/><rect x="11" y="30" width="17" height="6" rx="1" fill="#d9822a"${K}/>`,
 trena:`<rect x="5" y="11" width="21" height="21" rx="5" fill="#ffd34d"${K}/><circle cx="15.5" cy="21.5" r="4.5" fill="#e0b42e"${K1}/><path d="M26 26 H37 V31 H26" fill="#f6f1e7"${K1}/><path d="M29 26 V28 M32 26 V28 M35 26 V28" stroke="${O}" stroke-width="1"/>`,
 vidro:`<rect x="8" y="5" width="24" height="30" rx="2" fill="#bfe3ff"${K}/><path d="M13 29 L24 10 M18 31 L27 16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`,
 silicone:`<rect x="4" y="14" width="23" height="12" rx="2" fill="#f4f6f8"${K}/><rect x="7" y="17" width="11" height="6" rx="1" fill="#4aa3ff"/><path d="M27 16 L37 20 L27 24Z" fill="#cfd6de"${K}/><path d="M8 26 V33 H14" fill="none"${K}/>`,

 lanterna:`<path d="M25 13 L38 5 V35 L25 27Z" fill="#fff3b0" opacity=".85"/><rect x="3" y="15" width="17" height="10" rx="2" fill="#3a3f4a"${K}/><path d="M20 12 H26 V28 H20Z" fill="#8c96a1"${K}/><rect x="8" y="17" width="4" height="6" rx="1" fill="#e05a47"/>`,
 fenda:`<rect x="3" y="14" width="15" height="12" rx="4" fill="#e05a47"${K}/><path d="M6 17 V23" stroke="#ff9a8a" stroke-width="1.5"/><rect x="18" y="18" width="16" height="4" fill="#aab3be"${K1}/><path d="M34 18 L38 20 L34 22Z" fill="#aab3be"${K1}/>`,
 disjuntor:`<rect x="9" y="3" width="22" height="34" rx="3" fill="#9aa5b1"${K}/><rect x="14" y="7" width="12" height="14" rx="2" fill="#5c6670"${K1}/><rect x="16" y="8" width="8" height="7" rx="1" fill="${O}"/><path d="M22 23 L16 31 H20 L18 36 L25 28 H21 L23 23Z" fill="#ffd34d"${K1}/>`,
 tomada:`<rect x="8" y="4" width="24" height="32" rx="6" fill="#fafafa"${K}/><circle cx="16" cy="17" r="2.6" fill="${O}"/><circle cx="24" cy="17" r="2.6" fill="${O}"/><circle cx="20" cy="26" r="2.6" fill="${O}"/>`,

 registro:`<rect x="3" y="25" width="34" height="9" rx="1" fill="#aab3be"${K}/><rect x="17" y="15" width="6" height="11" fill="#aab3be"${K1}/><circle cx="20" cy="11" r="8.5" fill="none" stroke="${O}" stroke-width="6"/><circle cx="20" cy="11" r="8.5" fill="none" stroke="#e05a47" stroke-width="3.2"/><path d="M11.5 11 H28.5 M20 2.5 V19.5" stroke="${O}" stroke-width="2"/>`
};
const NAMES={balde:'Balde',luvas:'Luvas',trena:'Trena',vidro:'Vidro novo',silicone:'Silicone',martelo:'Martelo',fita:'Fita veda-rosca',pano:'Pano',chave:'Chave inglesa',lanterna:'Lanterna',fenda:'Chave de fenda',disjuntor:'Disjuntor',tomada:'Tomada nova',serrote:'Serrote',escada:'Escada',vassoura:'Vassoura',pincel:'Impermea­bilizante',telha:'Telha nova',triangulo:'Triângulo',chaveroda:'Chave de roda',macaco:'Macaco',estepe:'Estepe',banquinho:'Banquinho',alicate:'Alicate',resistencia:'Resistência nova',registro:'Registro'};
const icon=id=>`<svg viewBox="0 0 40 40">${IC[id]}</svg>`;

/* ================= HELPERS DE CENA ================= */
function defs(w1,w2,extra=''){return `<defs>
<linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${w1}"/><stop offset="1" stop-color="${w2}"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".45" r=".8"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></radialGradient>
<pattern id="tex" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".8" fill="#000" opacity=".07"/><circle cx="10" cy="10" r=".7" fill="#fff" opacity=".14"/></pattern>

const fadeDmg=(el,d)=>el.setAttribute('opacity',Math.min(.95,d/100).toFixed(2));

/* ================= ÁUDIO E UTILIDADES ================= */
let AC=null;
function beep(f=440,d=.08,type='square',v=.05){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=f;gn.gain.value=v;o.connect(gn);gn.connect(AC.destination);o.start();gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const $=id=>document.getElementById(id);
function getBest(){try{return JSON.parse(localStorage.getItem('consertaJa')||'{}')}catch(e){return {}}}
function setBest(id,st){try{const b=getBest();if(!b[id]||b[id]<st){b[id]=st;localStorage.setItem('consertaJa',JSON.stringify(b))}}catch(e){}}
const starStr=k=>'★'.repeat(k)+'☆'.repeat(3-k);
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id));window.scrollTo(0,0);if(id==='home')renderHome();if(id==='select')renderSelect()}
let toastT;
function toast(msg,cls='',ms=1400){const t=$('toast');t.textContent=msg;t.className='toast on '+cls;clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',ms)}
function shake(){const s=$('scene');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}
function modal(html){$('modalBox').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
const toolsOf=st=>[].concat(st.tool);

function renderHome(){
  $('hero').innerHTML=`<circle cx="100" cy="88" r="78" fill="#2f2b4d"/><circle cx="100" cy="88" r="78" fill="none" stroke="#3f3a66" stroke-width="3" stroke-dasharray="6 8"/>
  <path d="M48 92 L100 48 L152 92 V140 H48Z" fill="#f6f1e7"${K}/><path d="M38 96 L100 42 L162 96" fill="none" stroke="#e05a47" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 96 L100 42 L162 96" fill="none" stroke="${O}" stroke-width="2" stroke-linecap="round"/>
  <rect x="62" y="98" width="28" height="24" fill="#bfe3ff"${K}/><path d="M66 118 L84 100 M72 120 L82 110" stroke="#fff" stroke-width="2.5" opacity=".8"/><path d="M62 106 L76 112 L90 102" stroke="${O}" stroke-width="2" fill="none"/>
  <rect x="104" y="104" width="26" height="36" fill="#7a5232"${K}/><circle cx="124" cy="123" r="2" fill="#ffd34d"/>
  <rect x="128" y="54" width="12" height="22" fill="#a54d2b"${K}/>
  <g transform="translate(128 112) rotate(-35) scale(1.5)"><g transform="translate(-20 -20)">${IC.chave}</g></g>
  <g transform="translate(70 128) rotate(30) scale(1.2)"><g transform="translate(-20 -20)">${IC.fenda}</g></g>
  <g fill="#4aa3ff"><path d="M30 50 q5 8 0 12 q-5 -4 0 -12z"/><path d="M168 40 q4 7 0 10 q-4 -3 0 -10z"/></g>
  ${star(40,128,'#ffb84d',1.3)}${star(166,70,'#ffb84d',1)}`;
  const b=getBest(),tot=LEVELS.reduce((a,L)=>a+(b[L.id]||0),0);
  $('totalStars').innerHTML=`<b>★ ${tot}</b> de ${LEVELS.length*3} estrelas`;
}
function renderSelect(){
  const b=getBest();
  $('levels').innerHTML=LEVELS.map((L,i)=>`<button class="lvl" data-i="${i}"><span class="ico">${icon(L.icon)}</span><span><b>${i+1}. ${L.name}</b><small>${L.steps.length} etapas · ${L.meter}</small></span><span class="rt"><span class="st">${b[L.id]?starStr(b[L.id]):'☆☆☆'}</span><br><span class="chip c${L.diff}">${DIFF[L.diff]}</span></span></button>`).join('');
  document.querySelectorAll('.lvl').forEach(el=>el.onclick=()=>start(+el.dataset.i));
}
function renderHow(){
  const items=[
   ['pano','Leia o objetivo','Cada etapa diz o que precisa ser feito, mas não qual ferramenta usar. Esse é o desafio.'],
   ['chave','Escolha a ferramenta','Toque na ferramenta certa. Errar aumenta o dano, e algumas são perigosas fora de hora.'],
   ['luvas','Trabalhe na cena','Quando a cena ficar com borda tracejada: toque várias vezes ou segure o dedo, conforme a etapa pedir.'],
   ['triangulo','Reaja aos imprevistos','Botões vermelhos aparecem de repente. Toque antes do anel fechar.'],
   ['estepe','Conserte antes do estrago','O medidor de dano sobe com o tempo. Cada etapa concluída desacelera o estrago. Menos dano e menos erros = mais estrelas.']
  ];
  $('howList').innerHTML=items.map((it,i)=>`<div class="howc"><span class="n">${icon(it[0])}</span><span><b>${i+1}. ${it[1]}</b><p>${it[2]}</p></span></div>`).join('');
}
$('btnPlay').onclick=()=>{beep(660,.08,'triangle');show('select')};
$('btnHow').onclick=()=>{renderHow();show('how')};
$('btnHowPlay').onclick=()=>show('select');
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));

/* ================= JOGO ================= */
let S=null;
const cur=()=>S.L.steps[S.s];
function start(i){
  const L=LEVELS[i];
  S={i,L,s:0,d:0,mul:1,err:0,miss:0,mash:0,hold:0,holding:false,armed:false,t:0,idle:0,grace:0,qte:null,nextQte:12,run:false,done:false};
  $('lvName').textContent=L.name;
  show('game');renderTools();renderScene();renderStep();hud();
  modal(`<div class="big">${icon(L.icon)}</div><h2>${L.name}</h2><p>${L.desc}</p><p style="font-size:13px">${L.steps.length} etapas · <span class="chip c${L.diff}">${DIFF[L.diff]}</span></p><button class="btn p" id="go">Começar</button><button class="btn s" id="mn">Voltar</button>`);
  $('go').onclick=()=>{closeModal();beep(660,.1,'triangle');S.run=true;S.grace=4;loop(S)};
  $('mn').onclick=()=>{closeModal();S=null;show('select')};
}
function renderTools(){
  const ids=[...S.L.tools].sort(()=>Math.random()-.5);
  $('tools').innerHTML=ids.map(id=>`<button class="tool" data-id="${id}">${icon(id)}<span class="t">${NAMES[id]}</span></button>`).join('');
  document.querySelectorAll('.tool').forEach(el=>el.onclick=()=>useTool(el.dataset.id,el));
}
function renderScene(){
  $('svgWrap').innerHTML=`<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">${S.L.draw(S.s)}</svg>`;
  S.dmgEl=$('svgWrap').querySelector('#dmg');
}
function renderStep(){
  const st=cur();if(!st)return;
  let h=`<div class="n">Etapa ${S.s+1} de ${S.L.steps.length}</div><div class="g">${st.goal}</div>`;
  if(S.armed) h+=`<div class="act"><span id="progTxt">${st.hold?'Segure o dedo na cena':'Toque várias vezes na cena'}</span><div class="bar"><i id="prog"></i></div></div>`;
  $('step').innerHTML=h;
  $('scene').classList.toggle('armed',S.armed);
  document.querySelectorAll('.tool').forEach(el=>{el.classList.toggle('sel',S.armed&&toolsOf(st).includes(el.dataset.id));el.classList.remove('hint')});
  updProg();
}
function updProg(){
  const p=$('prog');if(!p||!S)return;const st=cur();if(!st)return;
  p.style.width=(st.hold?Math.min(1,S.hold/st.hold):S.mash/st.mash)*100+'%';
}
function hud(){
  const d=Math.min(100,S.d);
  $('meterName').innerHTML=S.L.meter+(S.run&&S.grace>0?' <span class="ps">· ⏸ pausa</span>':'');
  $('meterPct').textContent=Math.round(d)+'%';
  const f=$('meterFill');f.style.width=d+'%';f.style.background=d<40?'var(--ok)':d<70?'var(--acc)':'var(--bad)';
  const t=Math.floor(S.t);$('time').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  if(S.dmgEl)S.L.onDmg(S.dmgEl,d);
  const ob=$('observe');
  if(S.run&&S.s===0&&S.grace>0&&S.t<4.2){ob.style.display='grid';$('obsTxt').textContent='O tempo começa em '+Math.ceil(S.grace)+'s';}else ob.style.display='none';
}
function loop(state){
  let last=performance.now(),tick=0;
  function f(now){
    if(S!==state||state.done)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(state.run){
      state.t+=dt;
      if(state.grace>0)state.grace=Math.max(0,state.grace-dt);
      else state.d+=state.L.rate*state.mul*dt;
      if(!state.armed){state.idle+=dt;if(state.idle>8){const b=document.querySelector(`.tool[data-id="${toolsOf(cur())[0]}"]`);if(b&&!b.classList.contains('hint'))b.classList.add('hint')}}
      if(state.armed&&state.holding&&cur().hold){
        state.hold+=dt;tick+=dt;if(tick>.18){tick=0;beep(260+state.hold*200,.04,'square',.03);vib(10)}
        updProg();if(state.hold>=cur().hold){state.holding=false;advance();if(state.done)return}
      }
      if(!state.qte){if(state.grace<=0){state.nextQte-=dt;if(state.nextQte<=0)spawnQte()}}
      else{state.qte.left-=dt;if(state.qte.left<=0)missQte()}
      if(state.d>=100){state.d=100;hud();return lose()}
      hud();
    }
    requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}
function useTool(id,el){
  if(!S||!S.run)return;
  const st=cur();
  if(S.armed){if(!toolsOf(st).includes(id))toast(st.hold?'Termine primeiro: segure o dedo na cena':'Termine primeiro: toque na cena','bad');return}
  if(toolsOf(st).includes(id)){
    beep(880,.07,'triangle');
    if(st.mash||st.hold){S.armed=true;S.mash=0;S.hold=0;renderStep();toast(st.hold?'Agora segure o dedo na cena!':'Agora toque na cena!','ok')}
    else advance();
    return;
  }
  el.classList.add('no');setTimeout(()=>el.classList.remove('no'),450);
  shake();S.err++;
  if(st.danger&&st.danger[id]){S.d+=25;vib([80,40,180]);beep(110,.35,'sawtooth',.08);toast('⚠️ '+st.danger[id],'bad',2200)}
  else{S.d+=8;vib(90);beep(160,.15,'sawtooth');toast('Não é hora disso (+8 de dano)','bad')}
}
const scene=$('scene');
scene.addEventListener('contextmenu',e=>e.preventDefault());
scene.addEventListener('pointerdown',e=>{
  if(!S||!S.run||e.target.closest('.qte'))return;
  const st=cur();if(!st)return;
  if(!S.armed){toast(st.mash||st.hold?'Escolha a ferramenta primeiro':'Escolha uma ferramenta abaixo');return}
  e.preventDefault();
  if(st.hold){S.holding=true;return}
  S.mash++;beep(300+S.mash*60,.05,'square',.04);vib(15);
  const r=scene.getBoundingClientRect(),p=document.createElement('div');
  p.className='pop';p.textContent=['toc!','tac!','crec!','zip!'][S.mash%4];
  p.style.left=(e.clientX-r.left-15)+'px';p.style.top=(e.clientY-r.top-20)+'px';
  scene.appendChild(p);setTimeout(()=>p.remove(),500);
  if(S.mash>=st.mash)advance();else updProg();
});
['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,()=>{if(S)S.holding=false}));
function advance(){
  const st=cur();
  if(st.mul!=null)S.mul=st.mul;
  S.s++;S.armed=false;S.mash=0;S.hold=0;S.holding=false;S.idle=0;S.grace=Math.max(S.grace,1.5);
  renderScene();hud();
  if(S.s>=S.L.steps.length)return win();
  toast('✓ Etapa concluída','ok');renderStep();
}
function spawnQte(){
  if(S.s>=S.L.steps.length)return;
  const dur=Math.max(1.6,2.5-S.i*.15);
  S.qte={left:dur};
  const b=document.createElement('button');b.className='qte';
  b.innerHTML=S.L.qte[Math.floor(Math.random()*S.L.qte.length)]+`<span class="ring" style="animation-duration:${dur}s"></span>`;
  b.style.left=rnd(30,70)+'%';b.style.top=rnd(28,72)+'%';
  b.addEventListener('pointerdown',e=>{e.stopPropagation();if(!S||!S.qte)return;S.qte=null;b.remove();S.nextQte=rnd(9,14);S.d=Math.max(0,S.d-3);beep(1046,.12,'triangle');toast('Reflexo perfeito! (−3)','ok')});
  scene.appendChild(b);S.qteEl=b;beep(520,.1,'square');vib(40);
}
function missQte(){
  if(S.qteEl)S.qteEl.remove();S.qte=null;S.miss++;S.d+=12;S.nextQte=rnd(9,14);
  shake();vib([60,30,60]);beep(130,.25,'sawtooth');toast('Lento demais! (+12 de dano)','bad');
}
function clearQte(){if(S&&S.qteEl)S.qteEl.remove();if(S)S.qte=null}
function stats(){const t=Math.floor(S.t);return `<div class="stats"><div><b>${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</b>tempo</div><div><b>${Math.round(S.d)}%</b>${S.L.meter.toLowerCase()}</div><div><b>${S.err}</b>ferramentas erradas</div><div><b>${S.miss}</b>reflexos perdidos</div></div>`}
function win(){
  S.done=true;S.run=false;clearQte();$('observe').style.display='none';
  const score=Math.max(0,Math.round(100-S.d*.6-S.err*8-S.miss*6));
  const stars=score>=75?3:score>=45?2:1;setBest(S.L.id,stars);
  [660,880,1046].forEach((f,k)=>setTimeout(()=>beep(f,.15,'triangle',.06),k*120));
  const next=S.i+1<LEVELS.length;
  setTimeout(()=>{modal(`<h2>Consertado! 🛠️</h2><div class="stars">${starStr(stars)}</div>${stats()}
   ${next?'<button class="btn p" id="nx">Próxima fase</button>':''}<button class="btn ${next?'s':'p'}" id="rt">Jogar de novo</button><button class="btn s" id="mn">Fases</button>`);
   if(next)$('nx').onclick=()=>{closeModal();start(S.i+1)};
   $('rt').onclick=()=>{closeModal();start(S.i)};$('mn').onclick=()=>{closeModal();S=null;show('select')};},700);
}
function lose(){
  S.done=true;S.run=false;clearQte();vib([200,80,200]);beep(98,.5,'sawtooth',.08);
  modal(`<h2>Não deu tempo 💥</h2><p>${S.L.lose} Você parou na etapa ${S.s+1} de ${S.L.steps.length}.</p>${stats()}
   <button class="btn p" id="rt">Tentar de novo</button><button class="btn s" id="mn">Fases</button>`);
  $('rt').onclick=()=>{closeModal();start(S.i)};$('mn').onclick=()=>{closeModal();S=null;show('select')};
}
$('btnQuit').onclick=()=>{if(S){S.done=true;clearQte()}S=null;show('select')};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&S.run&&!S.done){S.run=false;S.holding=false;modal(`<h2>Pausado</h2><button class="btn p" id="rs">Continuar</button>`);$('rs').onclick=()=>{closeModal();if(S)S.run=true}}});
renderHome();
</script>
</body>
</html>
